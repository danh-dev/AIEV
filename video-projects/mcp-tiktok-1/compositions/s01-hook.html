<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>s01-hook</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=block&subset=vietnamese" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0e1a; }
      #root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
        font-family: "Be Vietnam Pro", "Inter", sans-serif;
        background:
          radial-gradient(1100px 900px at 50% 24%, rgba(0, 110, 255, 0.20) 0%, rgba(10, 14, 26, 0) 62%),
          radial-gradient(900px 820px at 82% 86%, rgba(0, 194, 255, 0.13) 0%, rgba(10, 14, 26, 0) 60%),
          linear-gradient(180deg, #0b1020 0%, #070b16 100%);
      }
      /* Lưới nền mờ tạo chiều sâu */
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(120, 190, 255, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(120, 190, 255, 0.055) 1px, transparent 1px);
        background-size: 90px 90px;
        -webkit-mask-image: radial-gradient(780px 780px at 50% 46%, #000 18%, transparent 78%);
        mask-image: radial-gradient(780px 780px at 50% 46%, #000 18%, transparent 78%);
      }
      .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(900px 1180px at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.55) 100%);
      }
      .brand {
        position: absolute; left: 62px; top: 64px;
        display: flex; align-items: center; gap: 16px;
        font-size: 26px; font-weight: 700; letter-spacing: 0.20em;
        color: rgba(190, 224, 255, 0.7); text-transform: uppercase;
      }
      .brand .bdot {
        width: 16px; height: 16px; border-radius: 50%;
        background: linear-gradient(120deg, #0061ff, #00c2ff);
        box-shadow: 0 0 18px rgba(0, 160, 255, 0.75);
      }
      /* Phần tử GSAP điều khiển — ẩn sẵn để không lóe ở frame đầu */
      .an { visibility: hidden; will-change: transform, opacity; }
      /* Chữ gradient: line-height 1.0 + padding trên/dưới để KHÔNG cụt dấu tiếng Việt */
      .grad {
        background: linear-gradient(100deg, #0061ff 0%, #00c2ff 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        line-height: 1.0; padding-top: 0.5em; padding-bottom: 0.16em;
        font-weight: 800; letter-spacing: -0.03em;
        filter: drop-shadow(0 0 30px rgba(0, 140, 255, 0.42));
      }
      .grad-warm {
        background: linear-gradient(100deg, #ff9d2e 0%, #ffd24d 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        line-height: 1.0; padding-top: 0.5em; padding-bottom: 0.16em;
        font-weight: 800; letter-spacing: -0.03em;
        filter: drop-shadow(0 0 30px rgba(255, 160, 60, 0.38));
      }
      .glass {
        background: rgba(12, 20, 40, 0.62);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border-radius: 24px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 0 0 1px rgba(120,200,255,0.14), 0 22px 60px rgba(0,0,0,0.5);
      }
      .chip {
        display: inline-flex; align-items: center; gap: 16px;
        padding: 22px 40px; border-radius: 999px;
        font-size: 42px; font-weight: 700; color: #ffffff; white-space: nowrap;
        background: rgba(12, 20, 40, 0.7);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), inset 0 0 0 1px rgba(120,200,255,0.18), 0 14px 38px rgba(0,0,0,0.45);
      }
      .chip .dot {
        width: 16px; height: 16px; border-radius: 50%;
        background: linear-gradient(120deg, #0061ff, #00c2ff);
        box-shadow: 0 0 14px rgba(0,160,255,0.8);
      }
      .chip.past { opacity: 0.4; }
      .chip.warm { box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), inset 0 0 0 1px rgba(255,190,90,0.3), 0 14px 38px rgba(0,0,0,0.45); }
      .chip.warm .dot { background: linear-gradient(120deg, #ff9d2e, #ffd24d); box-shadow: 0 0 14px rgba(255,170,60,0.8); }
      .row { display: flex; justify-content: center; gap: 26px; margin-bottom: 26px; }
      .shot { padding: 18px; }
      .shot img { display: block; border-radius: 14px; }
      .kw { color: #19c8ff; font-weight: 800; }
      .kw-warm { color: #ffcf4d; font-weight: 800; }
      .kicker {
        font-size: 34px; font-weight: 700; letter-spacing: 0.16em;
        color: rgba(180, 214, 255, 0.78); text-transform: uppercase;
      }

      /* ---- riêng s01-hook ---- */
      #badge { position: absolute; left: 0; right: 0; top: 452px; text-align: center; }
      #badge span {
        display: inline-block; padding: 16px 40px; border-radius: 999px;
        font-size: 30px; font-weight: 700; letter-spacing: 0.24em; color: #9fdcff;
        background: rgba(0, 120, 255, 0.16); text-transform: uppercase;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 0 0 1px rgba(120,200,255,0.26);
      }
      #title { position: absolute; left: 0; right: 0; top: 512px; text-align: center; }
      #title h1 { font-size: 150px; }
      #puzzle { position: absolute; left: 275px; top: 790px; width: 530px; }
      #puzzle img { width: 100%; }
      #tag { position: absolute; left: 0; right: 0; top: 1392px; text-align: center; }
      #tag .t { display: inline-block; font-size: 62px; font-weight: 800; color: #ffcf4d;
                filter: drop-shadow(0 0 26px rgba(255,180,60,0.35)); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="s01-hook"
      data-start="0"
      data-duration="2.3667"
      data-width="1080"
      data-height="1920"
    >
      <div class="grid"></div>
      <div class="brand"><span class="bdot"></span>noti.vn</div>

      <div id="badge" class="an"><span>TikTok chính thức</span></div>
      <div id="title" class="an"><h1 class="grad">TIKTOK MCP</h1></div>
      <div id="puzzle" class="an glass shot"><img src="assets/tipdilz7wysq-4koczm3j4zq2mpnagvby6g.png" alt=""></div>
      <div id="tag" class="an"><span class="t">hay phết!</span></div>
      <div class="vignette"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const DUR = 2.3667;
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, DUR); // neo đủ thời lượng — chống frame đen ở cuối scene

      /* helper nhịp chung */
      const inUp = (sel, at, o = {}) =>
        tl.fromTo(sel, { autoAlpha: 0, y: o.y ?? 26 },
          { autoAlpha: 1, y: 0, duration: o.dur ?? 0.4, ease: "power3.out" }, at);
      const pop = (sel, at, sc = 1) =>
        tl.fromTo(sel, { autoAlpha: 0, scale: 0.7 * sc, y: 18 },
          { autoAlpha: 1, scale: sc, y: 0, duration: 0.36, ease: "back.out(2)" }, at);

      /* Frame 0 phải có chữ ngay — đây là thumbnail của video, không được rỗng */
      tl.set("#badge, #title", { autoAlpha: 1 }, 0);
      tl.fromTo("#badge", { y: -18 }, { y: 0, duration: 0.34, ease: "power3.out" }, 0);
      tl.fromTo("#title", { scale: 0.9, y: 18 },
        { scale: 1, y: 0, duration: 0.5, ease: "back.out(1.6)" }, 0);
      tl.fromTo("#puzzle", { autoAlpha: 0, scale: 0.86, y: 42 },
        { autoAlpha: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(1.4)" }, 0.42);
      tl.to("#puzzle", { y: -16, duration: 1.5, ease: "sine.inOut" }, 1.0);
      tl.fromTo("#tag", { autoAlpha: 0, scale: 0.7 },
        { autoAlpha: 1, scale: 1, duration: 0.34, ease: "back.out(2)" }, 1.53);

      window.__timelines["s01-hook"] = tl;
    </script>
  </body>
</html>
