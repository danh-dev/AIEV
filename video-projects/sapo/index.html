<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Sapo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #101113;
        font-family: Inter, system-ui, sans-serif;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #101113;
      }
      .placeholder {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
      }
      .placeholder h1 { font-size: 64px; font-weight: 800; text-align: center; padding: 0 48px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="sapo"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
    >
      <div class="placeholder"><h1>Sapo</h1></div>
      <!-- Thêm scene: <div data-composition-id="s01" data-composition-src="compositions/s01.html" data-start="0" data-duration="3" data-track-index="1"></div> -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Anchor tween giữ đủ thời lượng slot, chống frame đen cuối composition
      tl.to({}, { duration: 5 }, 0);
      window.__timelines["sapo"] = tl;
    </script>
  </body>
</html>
