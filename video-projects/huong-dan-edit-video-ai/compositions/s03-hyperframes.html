<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>s03-hyperframes</title>
    <link rel="stylesheet" href="assets/base.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Ảnh minh họa AI full-bleed — chủ thể nằm nửa trên, chữ ở 1/3 dưới */
      #bg { position: absolute; inset: 0; overflow: hidden; }
      #bg img { width: 1080px; height: 1920px; object-fit: cover; display: block; }
      /* Scrim đáy: đủ tối để chữ trắng đọc rõ, không bịt mất ảnh */
      #scrim {
        position: absolute; left: 0; right: 0; bottom: 0; height: 1080px;
        background: linear-gradient(180deg,
          rgba(16,17,19,0) 0%, rgba(16,17,19,0.55) 34%,
          rgba(16,17,19,0.9) 68%, rgba(13,14,16,0.97) 100%);
        pointer-events: none;
      }
      #kicker { position: absolute; left: 84px; right: 84px; top: 1188px; }
      #kicker .pill {
        display: inline-flex; align-items: center; gap: 16px;
        padding: 18px 36px; border-radius: 50px;
        font-size: 30px; font-weight: 700; letter-spacing: 0.16em;
        text-transform: uppercase; color: rgba(233, 244, 255, 0.92);
        background: rgba(255, 255, 255, 0.07);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.24),
          inset 0 0 0 1px rgba(255,255,255,0.09),
          0 14px 38px rgba(0,0,0,0.4);
      }
      #kicker .pill i {
        width: 14px; height: 14px; border-radius: 50px;
        background: linear-gradient(120deg, #37bdf8, #8fd9ff);
        box-shadow: 0 0 14px rgba(55,189,248,0.85);
      }
      #rule {
        position: absolute; left: 88px; top: 1290px;
        width: 168px; height: 6px; border-radius: 50px;
        background: linear-gradient(90deg, #ed3c47, #ff7849);
        transform-origin: left center;
        box-shadow: 0 0 22px rgba(237,60,71,0.6);
      }
      #title { position: absolute; left: 84px; right: 84px; top: 1306px; }
      #title h1 { font-size: 116px; line-height: 1; }
      #sub { position: absolute; left: 88px; right: 84px; top: 1512px; }
      #sub > span { font-size: 50px; font-weight: 700; color: rgba(255,255,255,0.94); }
      /* keyword trong dòng sub — phải thắng #sub > span về specificity */
      #sub .kw { color: #37bdf8; }
      #sub .kw-hot { color: #ff7849; }
      #body { position: absolute; left: 88px; right: 96px; top: 1602px; }
      #body p { font-size: 42px; font-weight: 600; line-height: 1.4; color: rgba(255,255,255,0.8); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="s03-hyperframes"
      data-start="0"
      data-duration="2.2"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg"><img src="assets/illustrations/hyperframes-engine.png" alt="" /></div>
      <div id="scrim"></div>
      <div class="brand"><span class="bdot"></span>noti.vn</div>

      <div id="kicker" class="an"><span class="pill"><i></i>Bước 2 · Engine edit</span></div>
      <div id="rule" class="an"></div>
      <div id="title" class="an"><h1><span class="grad">HYPERFRAMES</span></h1></div>
      <div id="sub" class="an"><span>công cụ <span class="kw">edit chính</span></span></div>
      <div id="body" class="an"><p>Copy open source, dán vào Claude Code, Enter là cài xong.</p></div>
      <div class="vignette"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const DUR = 2.2;
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, DUR); // neo đủ thời lượng — chống frame đen ở cuối scene

      /* Ken Burns rất nhẹ trên ảnh — cảm giác sống, không làm chóng mặt */
      tl.fromTo("#bg img", { scale: 1.07, autoAlpha: 0.2 },
        { scale: 1.0, autoAlpha: 1, duration: DUR, ease: "none" }, 0);
      tl.fromTo("#scrim", { autoAlpha: 0.4 }, { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 0);

      tl.fromTo("#kicker", { autoAlpha: 0, y: 22 },
        { autoAlpha: 1, y: 0, duration: 0.36, ease: "power3.out" }, 0.06);
      tl.fromTo("#rule", { autoAlpha: 0, scaleX: 0 },
        { autoAlpha: 1, scaleX: 1, duration: 0.42, ease: "power3.out" }, 0.2);
      tl.fromTo("#title", { autoAlpha: 0, y: 34 },
        { autoAlpha: 1, y: 0, duration: 0.46, ease: "back.out(1.5)" }, 0.22);
      tl.fromTo("#sub", { autoAlpha: 0, y: 24 },
        { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.42);
      tl.fromTo("#body", { autoAlpha: 0, y: 20 },
        { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.56);
      /* trôi lên rất nhẹ suốt phần còn lại — giữ nhịp không đứng hình */
      tl.to("#kicker, #rule, #title, #sub, #body",
        { y: -10, duration: DUR - 0.7, ease: "sine.inOut" }, 0.7);

      window.__timelines["s03-hyperframes"] = tl;
    </script>
  </body>
</html>
