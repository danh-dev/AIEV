<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>s07-30phut</title>
    <link rel="stylesheet" href="assets/base.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      #halo {
        position: absolute; left: 140px; top: 520px;
        width: 800px; height: 800px; border-radius: 50px;
        background:
          radial-gradient(circle at 40% 40%, rgba(237, 60, 71, 0.32) 0%, rgba(16, 17, 19, 0) 60%),
          radial-gradient(circle at 70% 72%, rgba(255, 120, 73, 0.24) 0%, rgba(16, 17, 19, 0) 58%);
        filter: blur(34px);
      }
      #kicker { position: absolute; left: 0; right: 0; top: 590px; text-align: center; }
      #num { position: absolute; left: 0; right: 0; top: 668px; text-align: center; }
      #num .n {
        font-size: 300px; font-weight: 800; letter-spacing: -0.04em;
        background: linear-gradient(100deg, #ed3c47 0%, #ff7849 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        line-height: 1; filter: drop-shadow(0 0 40px rgba(237, 60, 71, 0.42));
      }
      #unit { position: absolute; left: 0; right: 0; top: 968px; text-align: center; }
      #unit span { font-size: 84px; font-weight: 800; letter-spacing: -0.02em; color: #ffffff; }
      /* 4 bước — mỗi bước một pill kính, xếp dọc */
      #steps { position: absolute; left: 140px; right: 140px; top: 1132px; }
      #steps .st {
        display: flex; align-items: center; gap: 24px;
        padding: 22px 34px; margin-bottom: 20px; border-radius: 24px;
        background: rgba(255, 255, 255, 0.055);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.2),
          inset 0 0 0 1px rgba(255, 255, 255, 0.07),
          0 14px 36px rgba(0, 0, 0, 0.38);
      }
      #steps .st b {
        flex: 0 0 auto; width: 56px; height: 56px; border-radius: 50px;
        display: flex; align-items: center; justify-content: center;
        font-size: 30px; font-weight: 800; color: #ffffff;
        background: linear-gradient(120deg, #37bdf8, #8fd9ff);
        box-shadow: 0 0 18px rgba(55, 189, 248, 0.55);
      }
      #steps .st span { font-size: 44px; font-weight: 700; color: rgba(255, 255, 255, 0.94); }
      #after { position: absolute; left: 120px; right: 120px; top: 1652px; text-align: center; }
      #after .t { font-size: 44px; font-weight: 700; line-height: 1.36; color: rgba(255, 255, 255, 0.9); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="s07-30phut"
      data-start="0"
      data-duration="2.6"
      data-width="1080"
      data-height="1920"
    >
      <div class="grid"></div>
      <div id="halo"></div>
      <div class="brand"><span class="bdot"></span>noti.vn</div>

      <div id="kicker" class="an kicker">Tổng thời gian setup</div>
      <div id="num" class="an"><span class="n" id="nval">0</span></div>
      <div id="unit" class="an"><span>PHÚT</span></div>
      <div id="steps">
        <div class="st an" data-i="1"><b>1</b><span>Clone open source về</span></div>
        <div class="st an" data-i="2"><b>2</b><span>Sửa Style Design</span></div>
        <div class="st an" data-i="3"><b>3</b><span>Tạo prompt từ video mẫu</span></div>
        <div class="st an" data-i="4"><b>4</b><span>AI đóng thành skill</span></div>
      </div>
      <div id="after" class="an">
        <div class="t">Sau đó mỗi video chỉ còn <span class="kw-hot">15–20 phút</span></div>
      </div>
      <div class="vignette"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const DUR = 2.6;
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, DUR); // neo đủ thời lượng — chống frame đen ở cuối scene

      tl.set("#kicker, #num, #unit", { autoAlpha: 1 }, 0);
      tl.fromTo("#kicker", { autoAlpha: 0, y: -16 },
        { autoAlpha: 1, y: 0, duration: 0.32, ease: "power3.out" }, 0);
      tl.fromTo("#num", { scale: 0.82 }, { scale: 1, duration: 0.6, ease: "back.out(1.5)" }, 0);
      tl.fromTo("#halo", { autoAlpha: 0.35, scale: 0.9 },
        { autoAlpha: 1, scale: 1.04, duration: DUR, ease: "sine.inOut" }, 0);

      /* Count-up 0 → 30, tất định theo timeline (không setInterval) */
      const counter = { v: 0 };
      tl.to(counter, {
        v: 30, duration: 0.86, ease: "power2.out",
        onUpdate: () => {
          document.getElementById("nval").textContent = Math.round(counter.v);
        },
      }, 0.06);

      tl.fromTo("#unit", { autoAlpha: 0, y: 20 },
        { autoAlpha: 1, y: 0, duration: 0.34, ease: "power3.out" }, 0.5);

      tl.fromTo("#steps .st", { autoAlpha: 0, x: -34 },
        { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out", stagger: 0.12 }, 0.72);
      tl.fromTo("#after", { autoAlpha: 0, y: 24 },
        { autoAlpha: 1, y: 0, duration: 0.42, ease: "back.out(1.3)" }, 1.36);

      window.__timelines["s07-30phut"] = tl;
    </script>
  </body>
</html>
