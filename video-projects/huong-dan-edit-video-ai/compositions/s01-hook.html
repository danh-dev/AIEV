<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>s01-hook</title>
    <link rel="stylesheet" href="assets/base.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Quầng sáng liquid glass phía sau khối chữ */
      #halo {
        position: absolute;
        left: 90px;
        top: 560px;
        width: 900px;
        height: 900px;
        border-radius: 50px;
        background:
          radial-gradient(circle at 34% 32%, rgba(237, 60, 71, 0.34) 0%, rgba(16, 17, 19, 0) 62%),
          radial-gradient(circle at 72% 70%, rgba(55, 189, 248, 0.3) 0%, rgba(16, 17, 19, 0) 60%);
        filter: blur(30px);
      }
      #kicker { position: absolute; left: 0; right: 0; top: 636px; text-align: center; }
      #kicker .pill {
        display: inline-flex; align-items: center; gap: 16px;
        padding: 20px 42px; border-radius: 50px;
        font-size: 32px; font-weight: 700; letter-spacing: 0.2em;
        text-transform: uppercase; color: rgba(233, 244, 255, 0.94);
        background: rgba(255, 255, 255, 0.075);
        backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.26),
          inset 0 0 0 1px rgba(255, 255, 255, 0.1),
          0 16px 42px rgba(0, 0, 0, 0.42);
      }
      #kicker .pill i {
        width: 14px; height: 14px; border-radius: 50px;
        background: linear-gradient(120deg, #ed3c47, #ff7849);
        box-shadow: 0 0 14px rgba(237, 60, 71, 0.85);
      }
      #l1 { position: absolute; left: 76px; right: 76px; top: 756px; text-align: center; }
      #l1 h1 { font-size: 132px; }
      #l2 { position: absolute; left: 76px; right: 76px; top: 918px; text-align: center; }
      #l2 h1 { font-size: 176px; }
      #card {
        position: absolute; left: 100px; right: 100px; top: 1214px;
        padding: 44px 44px; text-align: center;
      }
      #card .t { font-size: 44px; font-weight: 700; color: rgba(255, 255, 255, 0.95); line-height: 1.34; white-space: nowrap; }
      #tools { position: absolute; left: 0; right: 0; top: 1470px; text-align: center; }
      #tools .chip { font-size: 40px; padding: 22px 40px; }
      #note { position: absolute; left: 0; right: 0; top: 1614px; text-align: center; }
      #note span { font-size: 38px; font-weight: 600; color: rgba(255, 255, 255, 0.62); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="s01-hook"
      data-start="0"
      data-duration="2.4"
      data-width="1080"
      data-height="1920"
    >
      <div class="grid"></div>
      <div id="halo"></div>
      <div class="brand"><span class="bdot"></span>noti.vn</div>

      <div id="kicker" class="an"><span class="pill"><i></i>Hướng dẫn thực chiến</span></div>
      <div id="l1" class="an"><h1 class="plain">EDIT VIDEO</h1></div>
      <div id="l2" class="an"><h1 class="grad">BẰNG AI</h1></div>
      <div id="card" class="an glass">
        <div class="glass-sheen"></div>
        <div class="t">Cách mình đang làm — <span class="kw">từ A đến Z</span></div>
      </div>
      <div id="tools" class="an">
        <span class="chip hot"><span class="dot"></span>Claude Code + HyperFrames</span>
      </div>
      <div id="note" class="an"><span>góc nhìn cá nhân, dùng được ngay</span></div>
      <div class="vignette"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const DUR = 2.4;
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, DUR); // neo đủ thời lượng — chống frame đen ở cuối scene

      /* Frame đầu phải có chữ ngay — đây là mặt tiền của video */
      tl.set("#kicker, #l1, #l2", { autoAlpha: 1 }, 0);
      tl.fromTo("#kicker", { y: -18 }, { y: 0, duration: 0.34, ease: "power3.out" }, 0);
      tl.fromTo("#l1", { y: 26, scale: 0.94 },
        { y: 0, scale: 1, duration: 0.44, ease: "power3.out" }, 0);
      tl.fromTo("#l2", { y: 34, scale: 0.9 },
        { y: 0, scale: 1, duration: 0.54, ease: "back.out(1.6)" }, 0.1);
      tl.fromTo("#halo", { autoAlpha: 0.3, scale: 0.88 },
        { autoAlpha: 1, scale: 1, duration: 1.1, ease: "power2.out" }, 0);

      tl.fromTo("#card", { autoAlpha: 0, y: 40, scale: 0.94 },
        { autoAlpha: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.3)" }, 0.42);
      tl.fromTo("#tools", { autoAlpha: 0, y: 30 },
        { autoAlpha: 1, y: 0, duration: 0.42, ease: "back.out(1.8)" }, 0.72);
      tl.fromTo("#note", { autoAlpha: 0, y: 20 },
        { autoAlpha: 1, y: 0, duration: 0.38, ease: "power3.out" }, 0.94);

      /* thở rất nhẹ để không đứng hình ở cuối scene */
      tl.to("#l2", { y: -8, duration: 1.1, ease: "sine.inOut" }, 1.2);
      tl.to("#halo", { scale: 1.05, duration: 1.1, ease: "sine.inOut" }, 1.2);

      window.__timelines["s01-hook"] = tl;
    </script>
  </body>
</html>
